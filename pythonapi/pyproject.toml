[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vedastro"
version = "0.1.0"
description = "Experimental Python port of VedAstro core logic and API"
authors = [{name = "VedAstro"}]
dependencies = [
    "fastapi",
    "uvicorn",
    "astral",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "black",
    "mypy",
]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "B", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
